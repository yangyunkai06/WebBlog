# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: yangyunkai06/WebBlog
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/5b08d591-c912-4876-804c-e138e5456891/pkce
  auth_token_endpoint: /sites/5b08d591-c912-4876-804c-e138e5456891/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

site_url: https://yangyunkai06.github.io/WebBlog/
locale: 'zh_Hans'

# 图片上传后存放的位置
media_folder: 'source/images'
public_folder: '/images'

# simple 模式：点击发布即提交到 main，构建后上线
publish_mode: simple

collections:
  - name: 'posts'
    label: '文章'
    label_singular: '文章'
    folder: 'source/_posts'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: ['date', 'title']
    summary: '{{title}} — {{date}}'
    fields:
      - { label: '标题', name: 'title', widget: 'string' }
      - { label: '发布日期', name: 'date', widget: 'datetime' }
      - { label: '标签', name: 'tags', widget: 'list', required: false, default: [] }
      - { label: '分类', name: 'categories', widget: 'list', required: false, default: [] }
      - { label: '正文', name: 'body', widget: 'markdown' }
