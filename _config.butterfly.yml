# Butterfly 主题自定义配置（覆盖 node_modules 内主题默认值，只需写要改的项）

# 全站背景图（主题会自动补全 /WebBlog 前缀）
background: /img/bg1.jpg

# 首页卡片布局：6 = 双列（上图下文）
index_layout: 6

# 文章未设置封面时，随机从这里选一张当封面
cover:
  default_cover:
    - /img/bg1.jpg

# 页脚背景交给 CSS 透明化处理
footer_bg: false

# 自定义 CSS
inject:
  head:
    # ① 首页头图透明化（露出背景图、隐藏站名）+ 醒目下滑提示
    - >-
      <style>#page-header.full_page{background:transparent !important}#page-header.full_page #site-info{display:none !important}#page-header.full_page #scroll-down{bottom:7vh;text-align:center}#page-header.full_page #scroll-down::before{content:'下滑';display:block;margin-bottom:10px;font-size:22px;font-weight:700;letter-spacing:.35em;padding-left:.35em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:scrollBlink 2s ease-in-out infinite}#page-header.full_page #scroll-down .scroll-down-effects{font-size:44px !important;color:#fff !important;text-shadow:0 2px 10px rgba(0,0,0,.6) !important}@keyframes scrollBlink{0%,100%{opacity:1}50%{opacity:.45}}</style>
    # ② 卡片浅绿毛玻璃 + 悬浮上浮
    - >-
      <style>:root{--card-bg:rgba(208,240,220,.82)}#content-inner .card-widget,#content-inner .recent-post-item,#content-inner #page,#content-inner #post,#content-inner #archive,#content-inner #tag,#content-inner #category{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.08)}#content-inner .recent-post-item{transition:transform .3s ease,box-shadow .3s ease}#content-inner .recent-post-item:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(0,0,0,.14)}</style>
    # ③ 文章/归档等内页横幅改很浅的透明绿；页脚透明化（白字保证可读）
    - >-
      <style>#page-header.post-bg,#page-header.not-home-page{background-color:rgba(121,201,142,.28)!important}#footer{background-color:transparent !important}#footer>*,#footer a{color:#fff !important;text-shadow:0 1px 6px rgba(0,0,0,.55)}#footer a:hover{color:#d5f5e0 !important}</style>
    # ④ 首页应用式布局：内容区固定一屏，文章列表双列内部滚动，侧栏同步一屏放下（仅桌面端）
    - >-
      <style>@media screen and (min-width:900px){#page-header.full_page ~ #content-inner{height:100vh;padding:70px 15px 16px;overflow:hidden}#page-header.full_page ~ #content-inner #recent-posts{height:100%;overflow-y:auto;padding-right:4px}#page-header.full_page ~ #content-inner #aside-content{height:100%;overflow-y:auto;padding-right:4px}#recent-posts::-webkit-scrollbar,#aside-content::-webkit-scrollbar{width:6px}#recent-posts::-webkit-scrollbar-thumb,#aside-content::-webkit-scrollbar-thumb{background:rgba(121,201,142,.55);border-radius:6px}#recent-posts::-webkit-scrollbar-track,#aside-content::-webkit-scrollbar-track{background:transparent}#recent-posts,#aside-content{scrollbar-width:thin;scrollbar-color:rgba(121,201,142,.55) transparent}}</style>

footer:
  custom_text: '<a href="https://yangyunkai06.github.io/WebBlog/admin/" style="opacity:.55">管理</a>'
